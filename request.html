<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Request Material - Material Request</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Navigation -->
        <nav class="mobile-nav">
            <div class="nav-header">
                <i class="fas fa-boxes-stacked"></i>
                <span>Material Req</span>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="request.html" class="nav-item active">
                    <i class="fas fa-plus-circle"></i>
                    <span>Request</span>
                </a>
                <a href="history.html" class="nav-item">
                    <i class="fas fa-history"></i>
                    <span>History</span>
                </a>
                <a href="profile.html" class="nav-item">
                    <i class="fas fa-user"></i>
                    <span>Profile</span>
                </a>
            </div>
            <div class="nav-footer">
                <button onclick="logout()" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </nav>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <h2>Buat Permintaan</h2>
            </div>
            
            <form id="requestForm" class="request-form">
                <div class="form-group">
                    <label for="materialName">
                        <i class="fas fa-cube"></i> Nama Material
                    </label>
                    <input type="text" id="materialName" placeholder="Contoh: Semen, Besi, Cat" required>
                </div>
                
                <div class="form-group">
                    <label for="materialType">
                        <i class="fas fa-tag"></i> Jenis Material
                    </label>
                    <select id="materialType" required>
                        <option value="">Pilih Jenis</option>
                        <option value="Bahan Baku">Bahan Baku</option>
                        <option value="Bahan Penolong">Bahan Penolong</option>
                        <option value="Spare Part">Spare Part</option>
                        <option value="Peralatan">Peralatan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
                
                <div class="form-row">
                    <div class="form-group half">
                        <label for="quantity">
                            <i class="fas fa-weight-hanging"></i> Jumlah
                        </label>
                        <input type="number" id="quantity" placeholder="0" required min="1">
                    </div>
                    <div class="form-group half">
                        <label for="unit">
                            <i class="fas fa-ruler"></i> Satuan
                        </label>
                        <select id="unit" required>
                            <option value="Unit">Unit</option>
                            <option value="Kg">Kg</option>
                            <option value="Liter">Liter</option>
                            <option value="Meter">Meter</option>
                            <option value="Box">Box</option>
                            <option value="Pcs">Pcs</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="supplier">
                        <i class="fas fa-building"></i> Supplier
                    </label>
                    <input type="text" id="supplier" placeholder="Nama Supplier" required>
                </div>
                
                <div class="form-group">
                    <label for="priority">
                        <i class="fas fa-flag"></i> Prioritas
                    </label>
                    <select id="priority" required>
                        <option value="Normal">Normal</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="notes">
                        <i class="fas fa-pen"></i> Catatan
                    </label>
                    <textarea id="notes" rows="3" placeholder="Tambahkan catatan jika diperlukan"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="reset" class="btn-secondary">Reset</button>
                    <button type="submit" class="btn-primary" id="submitRequest">
                        <i class="fas fa-paper-plane"></i> Kirim Request
                    </button>
                </div>
                
                <div id="requestMessage" class="success-message" style="display:none"></div>
            </form>
        </main>
    </div>
    
    <script src="js/supabase-config.js"></script>
    <script src="js/request.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
