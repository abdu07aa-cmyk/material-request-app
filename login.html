<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login - Material Request</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Load Supabase SDK dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-boxes-stacked auth-logo"></i>
                <h2>Material Request</h2>
                <p>Login ke akun Anda</p>
            </div>
            
            <div id="loginError" class="error-message" style="display:none"></div>
            <div id="loginSuccess" class="success-message" style="display:none"></div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="Masukkan email" required value="test@demo.com">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Masukkan password" required value="password123">
                        <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary btn-block" id="loginBtn">
                    <span id="loginText">Login</span>
                    <i class="fas fa-spinner fa-spin" id="loginSpinner" style="display:none"></i>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Belum punya akun? <a href="#" id="registerLink">Daftar sekarang</a></p>
            </div>
            
            <div class="demo-credentials">
                <p>🔑 Demo: test@demo.com / password123</p>
                <button onclick="fillDemo()" class="btn-secondary" style="margin-top: 5px; font-size: 0.8rem;">
                    <i class="fas fa-fill-drip"></i> Isi Otomatis
                </button>
            </div>
        </div>
    </div>
    
    <script src="js/supabase-config.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
