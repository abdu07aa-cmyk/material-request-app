<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Login - Material Request</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-boxes-stacked auth-logo"></i>
                <h2>Material Request</h2>
                <p>Login ke akun Anda</p>
            </div>
            
            <div id="supabaseError" style="display:none; background: #FEE2E2; color: #991B1B; padding: 10px; border-radius: 8px; margin-bottom: 15px;"></div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="Masukkan email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="Masukkan password" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
                    </div>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> Ingat saya
                    </label>
                    <a href="#" class="forgot-password">Lupa password?</a>
                </div>
                
                <button type="submit" class="btn-primary btn-block" id="loginBtn">
                    <i class="fas fa-spinner fa-spin" style="display:none"></i>
                    <span id="loginText">Login</span>
                </button>
                
                <div id="loginError" class="error-message" style="display:none"></div>
            </form>
            
            <div class="auth-footer">
                <p>Belum punya akun? <a href="#" id="registerLink">Daftar sekarang</a></p>
            </div>
            
            <div class="demo-credentials">
                <p>Demo: test@demo.com / password123</p>
            </div>
        </div>
    </div>
    
    <!-- Load Supabase SDK dengan dynamic loader -->
    <script>
        function loadSupabaseSDK() {
            return new Promise((resolve, reject) => {
                if (typeof supabase !== 'undefined') {
                    resolve(supabase);
                    return;
                }
                
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
                script.async = false;
                script.onload = function() {
                    if (typeof supabase !== 'undefined') {
                        resolve(supabase);
                    } else {
                        reject(new Error('Supabase SDK loaded but not available'));
                    }
                };
                script.onerror = function() {
                    reject(new Error('Failed to load Supabase SDK'));
                };
                document.head.appendChild(script);
            });
        }
        
        (async function() {
            try {
                await loadSupabaseSDK();
                console.log('✅ Supabase SDK loaded');
                
                // Load config
                const configScript = document.createElement('script');
                configScript.src = 'js/supabase-config.js';
                document.body.appendChild(configScript);
                
                // Load auth after config
                configScript.onload = function() {
                    const authScript = document.createElement('script');
                    authScript.src = 'js/auth.js';
                    document.body.appendChild(authScript);
                };
            } catch (error) {
                console.error('Failed to load Supabase:', error);
                const errorEl = document.getElementById('supabaseError');
                if (errorEl) {
                    errorEl.style.display = 'block';
                    errorEl.textContent = '⚠️ Gagal load Supabase: ' + error.message;
                }
            }
        })();
    </script>
</body>
</html>
