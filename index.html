<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Material Request System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="landing-page">
        <div class="hero">
            <div class="logo-container">
                <i class="fas fa-boxes-stacked logo-icon"></i>
            </div>
            <h1>Material Request</h1>
            <p class="subtitle">Sistem Permintaan Material ke Supplier</p>
            <div class="hero-buttons">
                <a href="login.html" class="btn-primary btn-large">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                <a href="#" class="btn-secondary btn-large" id="demoBtn">
                    <i class="fas fa-play"></i> Demo
                </a>
            </div>
        </div>
        
        <div class="features">
            <div class="feature-card">
                <i class="fas fa-file-invoice"></i>
                <h3>Request Mudah</h3>
                <p>Buat permintaan material dengan cepat</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-history"></i>
                <h3>Riwayat Lengkap</h3>
                <p>Pantau semua permintaan Anda</p>
            </div>
            <div class="feature-card">
                <i class="fas fa-check-circle"></i>
                <h3>Status Real-time</h3>
                <p>Update status permintaan langsung</p>
            </div>
        </div>
        
        <footer class="landing-footer">
            <p>&copy; 2026 Material Request System</p>
        </footer>
    </div>
    
    <script src="js/supabase-config.js"></script>
    <script>
        document.getElementById('demoBtn').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Mode Demo: Silakan login dengan akun demo\ntest@demo.com / password123');
        });
    </script>
</body>
</html>
