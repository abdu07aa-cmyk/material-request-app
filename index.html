<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6a57">
<title>StokKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Tata letak: satu kolom sempit di tengah, header menempel di atas, navigasi tab di bawah, kartu ringkasan 2x2. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --surface2: #e8eeeb;
  --ink: #13211c;
  --muted: #5b6b64;
  --line: #d6dfdb;
  --accent: #0a6a57;
  --accent-ink: #ffffff;
  --out: #d9822b;
  --good: #1f7a45;
  --good-bg: #dff1e5;
  --warn: #8a5000;
  --warn-bg: #fbe9c8;
  --crit: #b3261e;
  --crit-bg: #fadad7;
  --shadow: 0 1px 2px rgba(19, 33, 28, .06), 0 6px 20px rgba(19, 33, 28, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1613; --surface: #16211d; --surface2: #1d2b26; --ink: #e6efeb; --muted: #93a59d;
    --line: #27382f; --accent: #3fc1a0; --accent-ink: #06211a; --out: #f0a04b;
    --good: #55c486; --good-bg: #173326; --warn: #f0b24d; --warn-bg: #3a2c10;
    --crit: #ff8a80; --crit-bg: #3d1a18; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }

/* Header */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.brand .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.brand svg, .logo svg { width: 20px; height: 20px; }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
.page-title { font-size: 24px; margin-bottom: 14px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 10px; }
.section-head h3 { font-size: 16px; }
.section-head button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }

/* Kartu */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
.tile.hero { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--shadow); }
.tile.hero .k { color: inherit; opacity: .8; }
.tile.hero .v { font-size: 32px; }
.tile .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.tile.hero .s { color: inherit; opacity: .85; }
.tile.alert-low .v { color: var(--warn); }
.tile.alert-out .v { color: var(--crit); }

/* Grafik */
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.bar-in { fill: var(--accent); }
.bar-out { fill: var(--out); }

/* Daftar */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; }
.item .name { font-weight: 700; overflow-wrap: anywhere; }
.item .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.item .qty { text-align: right; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.1; }
.item .qty small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.item .actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; }
.item.tap { cursor: pointer; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
.pill.ok { background: var(--good-bg); color: var(--good); }
.pill.low { background: var(--warn-bg); color: var(--warn); }
.pill.out { background: var(--crit-bg); color: var(--crit); }
.stripe-low { border-left: 5px solid var(--warn); }
.stripe-out { border-left: 5px solid var(--crit); }

.move { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.move:last-child { border-bottom: 0; }
.move .dot { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; }
.move .dot.in { background: var(--good-bg); color: var(--good); }
.move .dot.out { background: var(--warn-bg); color: var(--warn); }
.move .dot.adjust { background: var(--surface2); color: var(--muted); }
.move .t { font-weight: 600; overflow-wrap: anywhere; }
.move .m { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.move .q { text-align: right; font-weight: 700; font-family: var(--f-mono); font-size: 14px; }
.move .q.in { color: var(--good); }
.move .q.out { color: var(--warn); }
.move .q small { display: block; font-family: var(--f-body); font-weight: 500; color: var(--muted); font-size: 12px; }

/* Kontrol */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.sm { min-height: 38px; padding: 6px 12px; flex: 1; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: wait; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 10px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
input, select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 12px; min-height: 46px; font-size: 16px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; color: var(--muted); }
.search input { padding-left: 40px; }
.chips { display: flex; gap: 8px; margin: 10px 0 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-weight: 600; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface2); padding: 4px; border-radius: 14px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.seg button[data-t="in"][aria-pressed="true"] { color: var(--good); }
.seg button[data-t="out"][aria-pressed="true"] { color: var(--warn); }
.preview { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface2); font-size: 14px; }
.preview.bad { background: var(--crit-bg); color: var(--crit); }

/* Navigasi bawah */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 0; background: none; padding: 6px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }
.fab {
  position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: var(--shadow); cursor: pointer;
}
.fab svg { width: 26px; height: 26px; }

/* Sheet */
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 12, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--bg);
  border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sheet h2 { font-size: 20px; margin-bottom: 4px; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.sheet .btns { display: flex; gap: 10px; margin-top: 18px; }
.sheet .btns .btn { flex: 1; }
@media (min-width: 640px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; } }

/* Kosong, auth, toast */
.empty { text-align: center; padding: 34px 18px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }
.auth { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card .logo { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; margin-bottom: 16px; }
.auth-card .logo svg { width: 28px; height: 28px; }
.auth-card h1 { font-size: 32px; }
.auth-card .sub { color: var(--muted); margin: 6px 0 18px; }
.setup ol { padding-left: 20px; } .setup li { margin: 8px 0; }
code { font-family: var(--f-mono); background: var(--surface2); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
#toast {
  position: fixed; z-index: 90; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 420px);
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { background: var(--crit); color: #fff; }
.acc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.acc-row:last-child { border-bottom: 0; }
.acc-row .l { min-width: 0; overflow-wrap: anywhere; }
.acc-row .l small { display: block; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 });
const idr = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 });
const dtf = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const dayf = new Intl.DateTimeFormat('id-ID', { weekday: 'short' });
const num = v => Number(String(v).replace(',', '.')) || 0;
const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);

const I = {
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg>'
};

/* ---------- state ---------- */
const cfg = window.STOK_CONFIG || {};
const ready = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !/GANTI/.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY));
const state = { user: null, products: [], moves: [], tab: 'home', q: '', cat: '', stat: 'all', mtype: 'all', loading: false };
let sb = null;
const app = $('#app');

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, 3400);
}
const status = p => {
  const s = Number(p.stock), m = Number(p.min_stock);
  if (s <= 0) return 'out';
  if (m > 0 && s <= m) return 'low';
  return 'ok';
};
const STAT_LABEL = { ok: 'Aman', low: 'Menipis', out: 'Habis' };

/* ---------- layar awal ---------- */
function setupView() {
  app.innerHTML = `<div class="auth"><div class="auth-card setup">
    <div class="logo">${I.box}</div><h1>Hampir siap</h1>
    <p class="sub">Aplikasi belum terhubung ke Supabase.</p>
    <ol>
      <li>Buka <code>config.js</code> di repositori GitHub Anda.</li>
      <li>Isi <code>SUPABASE_URL</code> dan <code>SUPABASE_ANON_KEY</code> dari Supabase, menu Project Settings, API.</li>
      <li>Jalankan isi <code>supabase.sql</code> di SQL Editor Supabase.</li>
      <li>Simpan perubahan, lalu muat ulang halaman ini.</li>
    </ol></div></div>`;
}

function authView(mode = 'login') {
  const login = mode === 'login';
  app.innerHTML = `<div class="auth"><div class="auth-card">
    <div class="logo">${I.box}</div>
    <h1>StokKu</h1>
    <p class="sub">Catat stok masuk dan keluar, pantau barang yang hampir habis.</p>
    <form id="authForm">
      <label for="em">Email</label>
      <input id="em" type="email" autocomplete="email" required>
      <label for="pw">Kata sandi</label>
      <input id="pw" type="password" minlength="6" autocomplete="${login ? 'current-password' : 'new-password'}" required>
      <div style="margin-top:18px"><button class="btn primary block" id="authBtn">${login ? 'Masuk' : 'Buat akun'}</button></div>
    </form>
    <button class="link" id="swap">${login ? 'Belum punya akun? Daftar' : 'Sudah punya akun? Masuk'}</button>
  </div></div>`;
  $('#swap').onclick = () => authView(login ? 'signup' : 'login');
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#authBtn'); btn.disabled = true;
    const email = $('#em').value.trim(), password = $('#pw').value;
    try {
      if (login) {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await start(data.user);
      } else {
        const { data, error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        if (data.session) await start(data.user);
        else { toast('Akun dibuat. Cek email Anda untuk konfirmasi, lalu masuk.'); authView('login'); }
      }
    } catch (err) {
      toast(authMsg(err), true); btn.disabled = false;
    }
  };
}
function authMsg(e) {
  const m = e.message || '';
  if (/invalid login/i.test(m)) return 'Email atau kata sandi salah.';
  if (/already registered/i.test(m)) return 'Email sudah terdaftar. Silakan masuk.';
  if (/email not confirmed/i.test(m)) return 'Email belum dikonfirmasi. Cek kotak masuk Anda.';
  if (/rate limit/i.test(m)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  return m || 'Terjadi kesalahan.';
}

/* ---------- kerangka aplikasi ---------- */
function shell() {
  const tabs = [['home', 'Beranda', I.home], ['items', 'Barang', I.box], ['history', 'Riwayat', I.clock], ['me', 'Akun', I.user]];
  app.innerHTML = `
    <header class="top"><div class="brand"><span class="logo">${I.box}</span>StokKu</div>
      <button class="icon-btn" id="refreshBtn" data-act="refresh" aria-label="Muat ulang data">${I.refresh}</button></header>
    <main class="wrap" id="view"></main>
    <button class="fab" id="fab" data-act="new-product" aria-label="Tambah barang" hidden>${I.plus}</button>
    <nav class="tabs" aria-label="Menu utama"><div class="tabs-in">
      ${tabs.map(t => `<button class="tab" data-tab="${t[0]}">${t[2]}<span>${t[1]}</span></button>`).join('')}
    </div></nav>`;
}

async function loadAll() {
  state.loading = true; $('#refreshBtn')?.classList.add('spin');
  const [p, m] = await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('stock_movements').select('*, products(name, unit)').order('created_at', { ascending: false }).limit(500)
  ]);
  state.loading = false; $('#refreshBtn')?.classList.remove('spin');
  if (p.error || m.error) {
    const msg = (p.error || m.error).message;
    toast(/relation .* does not exist|schema cache/i.test(msg) ? 'Tabel belum ada. Jalankan supabase.sql di Supabase.' : msg, true);
    return;
  }
  state.products = p.data; state.moves = m.data;
  renderView();
}

async function start(user) {
  state.user = user; shell(); renderView(); await loadAll();
}

function renderView() {
  const v = $('#view'); if (!v) return;
  document.querySelectorAll('.tab').forEach(b => { if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('#fab').hidden = state.tab !== 'items';
  const keepSearch = document.activeElement && document.activeElement.id === 'q';
  v.innerHTML = ({ home: homeHTML, items: itemsHTML, history: historyHTML, me: meHTML })[state.tab]();
  if (keepSearch) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ---------- Beranda ---------- */
function weekChart() {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ d, in: 0, out: 0 }); }
  state.moves.forEach(m => {
    const t = new Date(m.created_at); t.setHours(0, 0, 0, 0);
    const x = days.find(o => o.d.getTime() === t.getTime());
    if (!x) return;
    if (m.type === 'in') x.in += Number(m.qty); else if (m.type === 'out') x.out += Number(m.qty);
  });
  const max = Math.max(1, ...days.flatMap(x => [x.in, x.out]));
  const base = 118, h = 96;
  const bars = days.map((x, i) => {
    const gx = 14 + i * 44;
    const hi = Math.max(x.in ? 2 : 0, x.in / max * h), ho = Math.max(x.out ? 2 : 0, x.out / max * h);
    return `<g><title>${esc(dayf.format(x.d))}: masuk ${nf.format(x.in)}, keluar ${nf.format(x.out)}</title>
      <rect class="bar-in" x="${gx}" y="${base - hi}" width="15" height="${hi}" rx="3"/>
      <rect class="bar-out" x="${gx + 17}" y="${base - ho}" width="15" height="${ho}" rx="3"/>
      <text x="${gx + 16}" y="136" text-anchor="middle">${esc(dayf.format(x.d))}</text></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 322 144" role="img" aria-label="Grafik stok masuk dan keluar 7 hari terakhir">
    <line class="grid" x1="0" x2="322" y1="${base}" y2="${base}"/>
    <line class="grid" x1="0" x2="322" y1="${base - h}" y2="${base - h}" stroke-dasharray="3 4"/>
    <text x="0" y="${base - h - 4}">${nf.format(max)}</text>${bars}</svg>`;
}

function homeHTML() {
  const P = state.products;
  if (!P.length && !state.loading) return `<h2 class="page-title">Beranda</h2><div class="card empty"><h3>Belum ada barang</h3>
    <p>Tambahkan barang pertama Anda, lalu catat stok masuk dan keluar.</p>
    <button class="btn primary" data-act="new-product">Tambah barang</button></div>`;
  const value = sum(P, p => Number(p.stock) * Number(p.buy_price));
  const low = P.filter(p => status(p) === 'low'), out = P.filter(p => status(p) === 'out');
  const need = [...out, ...low].slice(0, 5);
  return `<h2 class="page-title">Beranda</h2>
  <div class="tiles">
    <div class="tile hero"><div class="k">Nilai stok (harga beli)</div><div class="v num">${idr.format(value)}</div><div class="s">${nf.format(P.length)} jenis barang, ${nf.format(sum(P, p => Number(p.stock)))} unit</div></div>
    <div class="tile alert-low"><div class="k">Menipis</div><div class="v num">${low.length}</div><div class="s">di bawah stok minimum</div></div>
    <div class="tile alert-out"><div class="k">Habis</div><div class="v num">${out.length}</div><div class="s">perlu segera diisi</div></div>
  </div>
  <div class="section-head"><h3>Pergerakan 7 hari</h3></div>
  <div class="card"><div class="legend"><span><i style="background:var(--accent)"></i>Masuk</span><span><i style="background:var(--out)"></i>Keluar</span></div>${weekChart()}</div>
  <div class="section-head"><h3>Perlu restock</h3>${need.length ? '<button data-act="go-low">Lihat semua</button>' : ''}</div>
  ${need.length ? `<div class="list">${need.map(productRow).join('')}</div>` : '<div class="card empty" style="padding:20px"><p style="margin:0">Semua stok masih aman.</p></div>'}
  <div class="section-head"><h3>Aktivitas terbaru</h3><button data-act="go-history">Semua</button></div>
  <div class="card">${state.moves.length ? state.moves.slice(0, 5).map(moveRow).join('') : '<p class="empty" style="padding:12px;margin:0">Belum ada aktivitas.</p>'}</div>`;
}

/* ---------- Barang ---------- */
function productRow(p) {
  const st = status(p);
  return `<div class="item tap ${st === 'ok' ? '' : 'stripe-' + st}" data-act="edit" data-id="${esc(p.id)}">
    <div><div class="name">${esc(p.name)}<span class="pill ${st}">${STAT_LABEL[st]}</span></div>
      <div class="meta">${p.sku ? `<span class="mono">${esc(p.sku)}</span> · ` : ''}${esc(p.category || 'Tanpa kategori')}</div>
      <div class="meta">Min. ${nf.format(p.min_stock)} · Beli ${idr.format(p.buy_price)} · Jual ${idr.format(p.sell_price)}</div></div>
    <div class="qty num">${nf.format(p.stock)}<small>${esc(p.unit)}</small></div>
    <div class="actions"><button class="btn sm" data-act="move" data-t="in" data-id="${esc(p.id)}">+ Masuk</button>
      <button class="btn sm" data-act="move" data-t="out" data-id="${esc(p.id)}">− Keluar</button></div></div>`;
}
function filteredProducts() {
  const q = state.q.trim().toLowerCase();
  return state.products.filter(p =>
    (!q || (p.name + ' ' + (p.sku || '') + ' ' + (p.category || '')).toLowerCase().includes(q)) &&
    (!state.cat || p.category === state.cat) &&
    (state.stat === 'all' || status(p) === state.stat));
}
function itemsHTML() {
  const cats = [...new Set(state.products.map(p => p.category).filter(Boolean))].sort();
  const list = filteredProducts();
  const chip = (k, l) => `<button class="chip" data-act="stat" data-v="${k}" aria-pressed="${state.stat === k}">${l}</button>`;
  return `<h2 class="page-title">Barang</h2>
    <div class="search">${I.search}<input id="q" type="search" placeholder="Cari nama, SKU, atau kategori" value="${esc(state.q)}" aria-label="Cari barang"></div>
    <div class="chips">${chip('all', 'Semua')}${chip('low', 'Menipis')}${chip('out', 'Habis')}${chip('ok', 'Aman')}</div>
    ${cats.length ? `<label for="cat" style="margin-top:0">Kategori</label><select id="cat"><option value="">Semua kategori</option>${cats.map(c => `<option ${c === state.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select><div style="height:12px"></div>` : ''}
    ${list.length ? `<div class="list">${list.map(productRow).join('')}</div>` :
      `<div class="card empty"><h3>${state.products.length ? 'Tidak ada hasil' : 'Belum ada barang'}</h3><p>${state.products.length ? 'Ubah kata kunci atau filter.' : 'Ketuk tombol + untuk menambah barang pertama.'}</p></div>`}`;
}

/* ---------- Riwayat ---------- */
function moveRow(m) {
  const name = m.products?.name || 'Barang dihapus', unit = m.products?.unit || '';
  const sign = m.type === 'in' ? '+' : m.type === 'out' ? '−' : '=';
  const label = m.type === 'in' ? 'Masuk' : m.type === 'out' ? 'Keluar' : 'Koreksi';
  const shown = m.type === 'adjust' ? m.stock_after : m.qty;
  return `<div class="move"><div class="dot ${m.type}">${sign}</div>
    <div><div class="t">${esc(name)}</div><div class="m">${label}${m.note ? ' · ' + esc(m.note) : ''} · ${esc(dtf.format(new Date(m.created_at)))}</div></div>
    <div class="q ${m.type}">${sign}${nf.format(shown)} ${esc(unit)}<small>sisa ${nf.format(m.stock_after)}</small></div></div>`;
}
function historyHTML() {
  const chip = (k, l) => `<button class="chip" data-act="mtype" data-v="${k}" aria-pressed="${state.mtype === k}">${l}</button>`;
  const list = state.moves.filter(m => state.mtype === 'all' || m.type === state.mtype);
  return `<h2 class="page-title">Riwayat</h2>
    <div class="chips" style="margin-top:0">${chip('all', 'Semua')}${chip('in', 'Masuk')}${chip('out', 'Keluar')}${chip('adjust', 'Koreksi')}</div>
    <div class="card">${list.length ? list.map(moveRow).join('') : '<p class="empty" style="padding:16px;margin:0">Belum ada riwayat.</p>'}</div>
    ${state.moves.length >= 500 ? '<p class="meta" style="color:var(--muted);font-size:13px;text-align:center">Menampilkan 500 mutasi terbaru.</p>' : ''}`;
}

/* ---------- Akun ---------- */
function meHTML() {
  return `<h2 class="page-title">Akun</h2>
  <div class="card">
    <div class="acc-row"><div class="l">${esc(state.user.email)}<small>Data tersimpan di Supabase dan hanya bisa dilihat akun ini.</small></div></div>
    <div class="acc-row"><div class="l">Ekspor barang<small>${state.products.length} baris, format CSV</small></div><button class="btn sm" style="flex:none" data-act="csv-items">Unduh</button></div>
    <div class="acc-row"><div class="l">Ekspor riwayat<small>${state.moves.length} baris, format CSV</small></div><button class="btn sm" style="flex:none" data-act="csv-moves">Unduh</button></div>
  </div>
  <div style="margin-top:16px"><button class="btn danger block" data-act="logout">Keluar</button></div>`;
}

/* ---------- CSV ---------- */
function toCSV(rows) {
  return rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\r\n');
}
function download(name, text) {
  const url = URL.createObjectURL(new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
const stamp = () => new Date().toISOString().slice(0, 10);

/* ---------- sheet ---------- */
function openSheet(html) {
  $('#sheet').innerHTML = html; $('#sheetBack').hidden = false;
  document.body.style.overflow = 'hidden';
  const f = $('#sheet input:not([type=hidden]), #sheet button'); if (f && matchMedia('(pointer:fine)').matches) f.focus();
}
function closeSheet() { $('#sheetBack').hidden = true; $('#sheet').innerHTML = ''; document.body.style.overflow = ''; }
$('#sheetBack').addEventListener('mousedown', e => { if (e.target.id === 'sheetBack') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetBack').hidden) closeSheet(); });

function productSheet(p) {
  const isNew = !p; p = p || {};
  const cats = [...new Set(state.products.map(x => x.category).filter(Boolean))].sort();
  openSheet(`<h2>${isNew ? 'Barang baru' : 'Ubah barang'}</h2><p class="sub">${isNew ? 'Isi data dasar. Stok awal akan masuk ke riwayat.' : 'Stok diubah lewat tombol Masuk, Keluar, atau Koreksi.'}</p>
    <form id="pf" autocomplete="off">
      <label for="f-name">Nama barang</label><input id="f-name" required maxlength="120" value="${esc(p.name)}">
      <div class="row2"><div><label for="f-sku">SKU / kode</label><input id="f-sku" maxlength="60" value="${esc(p.sku)}"></div>
        <div><label for="f-unit">Satuan</label><input id="f-unit" required maxlength="20" value="${esc(p.unit || 'pcs')}"></div></div>
      <label for="f-cat">Kategori</label><input id="f-cat" list="cats" maxlength="60" value="${esc(p.category)}"><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <div class="row2">${isNew ? `<div><label for="f-stock">Stok awal</label><input id="f-stock" inputmode="decimal" value="0"></div>` : ''}
        <div><label for="f-min">Stok minimum</label><input id="f-min" inputmode="decimal" value="${esc(p.min_stock ?? 0)}"></div></div>
      <div class="row2"><div><label for="f-buy">Harga beli (Rp)</label><input id="f-buy" inputmode="decimal" value="${esc(p.buy_price ?? 0)}"></div>
        <div><label for="f-sell">Harga jual (Rp)</label><input id="f-sell" inputmode="decimal" value="${esc(p.sell_price ?? 0)}"></div></div>
      <div class="btns"><button type="button" class="btn" data-act="close">Batal</button><button class="btn primary" id="pfSave">Simpan</button></div>
      ${isNew ? '' : '<div style="margin-top:12px"><button type="button" class="btn danger block" id="pfDel">Hapus barang</button></div>'}
    </form>`);
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#pfSave'); btn.disabled = true;
    const row = {
      name: $('#f-name').value.trim(), sku: $('#f-sku').value.trim() || null, unit: $('#f-unit').value.trim() || 'pcs',
      category: $('#f-cat').value.trim() || null, min_stock: Math.max(0, num($('#f-min').value)),
      buy_price: Math.max(0, num($('#f-buy').value)), sell_price: Math.max(0, num($('#f-sell').value))
    };
    try {
      if (isNew) {
        const init = Math.max(0, num($('#f-stock').value));
        const { data, error } = await sb.from('products').insert({ ...row, stock: 0 }).select().single();
        if (error) throw error;
        if (init > 0) { const r = await sb.rpc('record_movement', { p_product: data.id, p_type: 'in', p_qty: init, p_note: 'Stok awal' }); if (r.error) throw r.error; }
      } else {
        const { error } = await sb.from('products').update({ ...row, updated_at: new Date().toISOString() }).eq('id', p.id);
        if (error) throw error;
      }
      closeSheet(); toast('Barang disimpan'); await loadAll();
    } catch (err) {
      toast(err.code === '23505' ? 'SKU sudah dipakai barang lain.' : err.message, true); btn.disabled = false;
    }
  };
  const del = $('#pfDel');
  if (del) del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Ketuk lagi untuk menghapus beserta riwayatnya'; setTimeout(() => { if (del.isConnected) { delete del.dataset.sure; del.textContent = 'Hapus barang'; } }, 4000); return; }
    del.disabled = true;
    const { error } = await sb.from('products').delete().eq('id', p.id);
    if (error) { toast(error.message, true); del.disabled = false; return; }
    closeSheet(); toast('Barang dihapus'); await loadAll();
  };
}

function moveSheet(p, type) {
  let t = type;
  openSheet(`<h2>${esc(p.name)}</h2><p class="sub">Stok saat ini <b class="num">${nf.format(p.stock)} ${esc(p.unit)}</b></p>
    <form id="mf" autocomplete="off">
      <div class="seg" role="group" aria-label="Jenis mutasi">
        <button type="button" data-t="in">Masuk</button><button type="button" data-t="out">Keluar</button><button type="button" data-t="adjust">Koreksi</button></div>
      <label for="m-qty" id="m-qty-l">Jumlah</label><input id="m-qty" inputmode="decimal" required placeholder="0">
      <label for="m-note">Catatan (opsional)</label><input id="m-note" maxlength="160" placeholder="Contoh: pembelian dari supplier">
      <div class="preview" id="m-prev"></div>
      <div class="btns"><button type="button" class="btn" data-act="close">Batal</button><button class="btn primary" id="mSave">Simpan</button></div>
    </form>`);
  const calc = () => {
    const q = num($('#m-qty').value), cur = Number(p.stock);
    const next = t === 'in' ? cur + q : t === 'out' ? cur - q : q;
    const bad = t === 'out' && q > cur;
    const prev = $('#m-prev');
    prev.className = 'preview' + (bad ? ' bad' : '');
    prev.textContent = bad ? `Stok tidak cukup. Tersisa ${nf.format(cur)} ${p.unit}.` : `Stok setelah disimpan: ${nf.format(next)} ${p.unit}`;
    $('#mSave').disabled = bad;
  };
  const sync = () => {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    $('#m-qty-l').textContent = t === 'adjust' ? 'Stok sebenarnya (hasil hitung)' : 'Jumlah';
    calc();
  };
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { t = b.dataset.t; sync(); });
  $('#m-qty').oninput = calc; sync();
  $('#m-qty').focus();
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#mSave'); btn.disabled = true;
    const qty = num($('#m-qty').value);
    if (t !== 'adjust' && qty <= 0) { toast('Jumlah harus lebih dari 0.', true); btn.disabled = false; return; }
    const { error } = await sb.rpc('record_movement', { p_product: p.id, p_type: t, p_qty: qty, p_note: $('#m-note').value });
    if (error) { toast(error.message, true); btn.disabled = false; return; }
    closeSheet(); toast('Stok diperbarui'); await loadAll();
  };
}

/* ---------- event ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderView(); scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, find = () => state.products.find(p => p.id === el.dataset.id);
  if (act === 'close') return closeSheet();
  if (act === 'refresh') return loadAll();
  if (act === 'new-product') return productSheet(null);
  if (act === 'edit') { const p = find(); if (p) productSheet(p); return; }
  if (act === 'move') { e.stopPropagation(); const p = find(); if (p) moveSheet(p, el.dataset.t); return; }
  if (act === 'stat') { state.stat = el.dataset.v; return renderView(); }
  if (act === 'mtype') { state.mtype = el.dataset.v; return renderView(); }
  if (act === 'go-low') { state.tab = 'items'; state.stat = 'low'; return renderView(); }
  if (act === 'go-history') { state.tab = 'history'; return renderView(); }
  if (act === 'csv-items') {
    download(`stokku-barang-${stamp()}.csv`, toCSV([['SKU', 'Nama', 'Kategori', 'Satuan', 'Stok', 'Stok minimum', 'Harga beli', 'Harga jual', 'Status'],
      ...state.products.map(p => [p.sku, p.name, p.category, p.unit, p.stock, p.min_stock, p.buy_price, p.sell_price, STAT_LABEL[status(p)]])]));
    return;
  }
  if (act === 'csv-moves') {
    download(`stokku-riwayat-${stamp()}.csv`, toCSV([['Waktu', 'Barang', 'Jenis', 'Jumlah', 'Stok setelah', 'Catatan'],
      ...state.moves.map(m => [m.created_at, m.products?.name || '', m.type === 'in' ? 'Masuk' : m.type === 'out' ? 'Keluar' : 'Koreksi', m.qty, m.stock_after, m.note])]));
    return;
  }
  if (act === 'logout') { await sb.auth.signOut(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { state.q = e.target.value; renderView(); } });
document.addEventListener('change', e => { if (e.target.id === 'cat') { state.cat = e.target.value; renderView(); } });

/* ---------- mulai ---------- */
(async function init() {
  if (!ready) return setupView();
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.user = null; state.products = []; state.moves = []; state.tab = 'home'; closeSheet(); authView(); } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session.user); else authView();
})();
})();
</script>
</body>
</html>
