<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f292e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="StokKu">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>StokKu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Tata letak: satu kolom sempit di tengah, header menempel di atas, navigasi tab di bawah, kartu ringkasan 2x2. */
:root {
  --bg: #f2f5f3;
  --surface: #ffffff;
  --surface2: #e8eeeb;
  --ink: #13211c;
  --muted: #5b6b64;
  --line: #d6dfdb;
  --accent: #0a6a57;
  --accent-ink: #ffffff;
  --out: #d9822b;
  --good: #1f7a45;
  --good-bg: #dff1e5;
  --warn: #8a5000;
  --warn-bg: #fbe9c8;
  --crit: #b3261e;
  --crit-bg: #fadad7;
  --shadow: 0 1px 2px rgba(19, 33, 28, .06), 0 6px 20px rgba(19, 33, 28, .06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1613; --surface: #16211d; --surface2: #1d2b26; --ink: #e6efeb; --muted: #93a59d;
    --line: #27382f; --accent: #3fc1a0; --accent-ink: #06211a; --out: #f0a04b;
    --good: #55c486; --good-bg: #173326; --warn: #f0b24d; --warn-bg: #3a2c10;
    --crit: #ff8a80; --crit-bg: #3d1a18; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }

/* Header */
.top {
  position: sticky; top: 0; z-index: 20; background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 800; font-size: 20px; }
.mark { display: block; width: 34px; height: 34px; border-radius: 10px; }
.mark.big { width: 64px; height: 64px; border-radius: 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 20px; height: 20px; }
.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hbtns { display: flex; gap: 8px; }
.bell { position: relative; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--bg); }
.bell.has { color: var(--crit); border-color: var(--crit); }
.bell.has svg { animation: ring 1.6s ease-in-out 2; transform-origin: 50% 10%; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 10%, 30%, 50% { transform: rotate(14deg); } 20%, 40% { transform: rotate(-14deg); } 60% { transform: rotate(0); } }
.alert-banner { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; border: 1px solid; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; cursor: pointer; }
.alert-banner b { font-size: 15px; }
.alert-banner span { font-size: 13px; }
.alert-banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.alert-banner.crit { background: var(--crit-bg); color: var(--crit); border-color: var(--crit); }
.limit-box { margin-top: 12px; padding: 14px; border-radius: 16px; border: 1px solid; }
.limit-box.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.limit-box.crit { background: var(--crit-bg); color: var(--crit); border-color: var(--crit); }
.limit-box .nm { font-family: var(--f-display); font-weight: 800; font-size: 20px; overflow-wrap: anywhere; }
.limit-box .sz { font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
.limit-box .ln { margin-top: 10px; font-size: 15px; }
.limit-box .ln b { font-family: var(--f-display); font-size: 22px; }

.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
.page-title { font-size: 24px; margin-bottom: 14px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 0 10px; }
.section-head h3 { font-size: 16px; }
.section-head button { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 4px 0; }

/* Kartu */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.tile .v { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
.tile.hero { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); box-shadow: var(--shadow); }
.tile.hero .k { color: inherit; opacity: .8; }
.tile.hero .v { font-size: 34px; }
.tile .s { font-size: 13px; color: var(--muted); margin-top: 2px; }
.tile.hero .s { color: inherit; opacity: .85; }
.tile.alert-low .v { color: var(--warn); }
.tile.alert-out .v { color: var(--crit); }

/* Grafik */
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 11px var(--f-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.bar-in { fill: var(--accent); }
.bar-out { fill: var(--out); }

/* Daftar barang */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: start; gap: 4px 12px; }
.item .name { font-weight: 700; overflow-wrap: anywhere; }
.item .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.item .qty { text-align: right; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1.1; }
.item .qty small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.item .actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 8px; }
.item.tap { cursor: pointer; }
.thumb { width: 56px; height: 56px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--surface2); padding: 0; display: grid; place-items: center; color: var(--muted); }
button.thumb { cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb svg { width: 24px; height: 24px; }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
.pill.ok { background: var(--good-bg); color: var(--good); }
.pill.low { background: var(--warn-bg); color: var(--warn); }
.pill.out { background: var(--crit-bg); color: var(--crit); }
.stripe-low { border-left: 5px solid var(--warn); }
.stripe-out { border-left: 5px solid var(--crit); }

.catrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; cursor: pointer; }
.catrow:last-child { border-bottom: 0; }
.catrow .cn { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.catrow .cn small { display: block; color: var(--muted); font-weight: 500; }
.catrow .cp { flex: none; }

.move { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.move:last-child { border-bottom: 0; }
.move .dot { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; }
.move .dot.in { background: var(--good-bg); color: var(--good); }
.move .dot.out { background: var(--warn-bg); color: var(--warn); }
.move .dot.adjust { background: var(--surface2); color: var(--muted); }
.move .t { font-weight: 600; overflow-wrap: anywhere; }
.move .m { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.move .q { text-align: right; font-weight: 700; font-family: var(--f-mono); font-size: 14px; }
.move .q.in { color: var(--good); }
.move .q.out { color: var(--warn); }
.move .q small { display: block; font-family: var(--f-body); font-weight: 500; color: var(--muted); font-size: 12px; }

/* Kontrol */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 14px; font-weight: 700; cursor: pointer; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
.btn.sm { min-height: 38px; padding: 6px 12px; flex: 1; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .55; cursor: wait; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 10px; }
label, .lbl { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
input, select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 12px; min-height: 46px; font-size: 16px;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; color: var(--muted); }
.search input { padding-left: 40px; }
.chips { display: flex; gap: 8px; margin: 10px 0 12px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-weight: 600; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .cnt { margin-left: 6px; font-family: var(--f-mono); font-size: 12px; opacity: .7; }
.chip.manage { border-style: dashed; color: var(--accent); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface2); padding: 4px; border-radius: 14px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 10px 6px; font-weight: 700; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); }
.seg button[data-t="in"][aria-pressed="true"] { color: var(--good); }
.seg button[data-t="out"][aria-pressed="true"] { color: var(--warn); }
.preview { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface2); font-size: 14px; }
.preview.bad { background: var(--crit-bg); color: var(--crit); }

/* Foto, kategori, ekspor di dalam sheet */
.photo-field { display: flex; gap: 12px; align-items: center; }
.pf-prev { width: 96px; height: 96px; flex: none; border-radius: 16px; overflow: hidden; border: 1px dashed var(--line); background: var(--surface2); display: grid; place-items: center; color: var(--muted); }
.pf-prev img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pf-prev svg { width: 32px; height: 32px; }
.pf-btns { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; flex: 1; }
.pf-btns .btn { flex: 1 1 90px; }
.row-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin: 12px 0; }
.cat-list { display: flex; flex-direction: column; gap: 8px; }
.cat-edit { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.cat-edit .n { font-family: var(--f-mono); color: var(--muted); font-size: 13px; min-width: 24px; text-align: right; }
.cat-edit .btn { flex: none; min-height: 44px; }
.big { width: 100%; max-height: 60dvh; object-fit: contain; border-radius: 14px; background: var(--surface2); display: block; margin-top: 8px; }
label.check { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 15px; font-weight: 600; margin: 16px 0; }
label.check input { width: 22px; height: 22px; min-height: 0; flex: none; }

/* Navigasi bawah */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
}
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tab { border: 0; background: none; padding: 6px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] svg { stroke-width: 2.4; }
.fab {
  position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; box-shadow: var(--shadow); cursor: pointer;
}
.fab svg { width: 26px; height: 26px; }

/* Sheet */
.sheet-back { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 12, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 560px; max-height: 92dvh; overflow-y: auto; background: var(--bg);
  border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  animation: up .22s ease-out;
}
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sheet h2 { font-size: 20px; margin-bottom: 4px; }
.sheet .sub { color: var(--muted); font-size: 14px; margin: 0 0 6px; }
.sheet .btns { display: flex; gap: 10px; margin-top: 18px; }
.sheet .btns .btn { flex: 1; }
@media (min-width: 640px) { .sheet-back { align-items: center; } .sheet { border-radius: 22px; } }

/* Kosong, auth, toast */
.empty { text-align: center; padding: 34px 18px; color: var(--muted); }
.empty h3 { color: var(--ink); font-size: 18px; margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }
.auth { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 400px; }
.auth-card h1 { font-size: 32px; }
.auth-card .sub { color: var(--muted); margin: 6px 0 18px; }
.setup ol { padding-left: 20px; } .setup li { margin: 8px 0; }
code { font-family: var(--f-mono); background: var(--surface2); padding: 1px 6px; border-radius: 6px; font-size: 13px; }
#toast {
  position: fixed; z-index: 90; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  bottom: calc(92px + env(safe-area-inset-bottom, 0px)); max-width: min(92vw, 420px);
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { background: var(--crit); color: #fff; }
.acc-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.acc-row:last-child { border-bottom: 0; }
.acc-row .l { min-width: 0; overflow-wrap: anywhere; }
.acc-row .l small { display: block; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- util ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('id-ID', { maximumFractionDigits: 2 });
const dtf = new Intl.DateTimeFormat('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const dayf = new Intl.DateTimeFormat('id-ID', { weekday: 'short' });
const longf = new Intl.DateTimeFormat('id-ID', { dateStyle: 'long', timeStyle: 'short' });
const num = v => Number(String(v).replace(',', '.')) || 0;
const BUCKET = 'product-photos';

const I = {
  box: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 10-2.3 5.7"/><path d="M20 4v7h-7"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 004 0"/></svg>'
};

/* ---------- state ---------- */
const cfg = window.STOK_CONFIG || {};
const ready = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && !/GANTI/.test(cfg.SUPABASE_URL + cfg.SUPABASE_ANON_KEY));
const state = { user: null, products: [], cats: [], moves: [], photos: {}, photoAt: 0, alerted: false, tab: 'home', q: '', cat: '', stat: 'all', mtype: 'all', loading: false };
let sb = null, catDraw = null;
const app = $('#app');

const catName = id => (state.cats.find(c => c.id === id) || {}).name || '';
const catOf = p => catName(p.category_id) || 'Tanpa kategori';

function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = ''; }, 3600);
}
const status = p => {
  const s = Number(p.stock), m = Number(p.min_stock);
  if (s <= 0) return 'out';
  if (m > 0 && s <= m) return 'low';
  return 'ok';
};

function authView(mode = 'login') {

  $('#swap').onclick = () => authView(login ? 'signup' : 'login');

function authMsg(e) {
  const m = e.message || '';
  if (/invalid login/i.test(m)) return 'Email atau kata sandi salah.';
  if (/already registered/i.test(m)) return 'Email sudah terdaftar. Silakan masuk.';
  if (/email not confirmed/i.test(m)) return 'Email belum dikonfirmasi. Cek kotak masuk Anda.';
  if (/rate limit/i.test(m)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';

async function signPhotos() {
  if (Date.now() - state.photoAt > 5 * 3600 * 1000) { state.photos = {}; state.photoAt = Date.now(); }
  const need = [...new Set(state.products.map(p => p.photo_path).filter(Boolean))].filter(x => !state.photos[x]);
  if (!need.length) return;
  const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 6 * 3600);
  if (error || !data) return;
  data.forEach(d => { if (d.signedUrl) state.photos[d.path] = d.signedUrl; });
}

async function loadAll() {
  state.loading = true; $('#refreshBtn')?.classList.add('spin');
  const [p, c, m] = await Promise.all([
    sb.from('products').select('*').order('name'),
    sb.from('categories').select('*').order('name'),
    sb.from('stock_movements').select('*, products(name, unit, size)').order('created_at', { ascending: false }).limit(500)
  ]);
  state.loading = false; $('#refreshBtn')?.classList.remove('spin');
  const err = p.error || c.error || m.error;
  if (err) {
    toast(/does not exist|schema cache|column/i.test(err.message) ? 'Database belum diperbarui. Jalankan supabase.sql terbaru di Supabase.' : err.message, true);
    return;
  }
  state.products = p.data; state.cats = c.data; state.moves = m.data;
  if (state.cat && state.cat !== '__none' && !state.cats.some(x => x.id === state.cat)) state.cat = '';

function weekChart() {
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i); days.push({ d, in: 0, out: 0 }); }
  state.moves.forEach(m => {
    const t = new Date(m.created_at); t.setHours(0, 0, 0, 0);
    const x = days.find(o => o.d.getTime() === t.getTime());
    if (!x) return;
    if (m.type === 'in') x.in += Number(m.qty); else if (m.type === 'out') x.out += Number(m.qty);
  });
  const max = Math.max(1, ...days.flatMap(x => [x.in, x.out]));
  const base = 118, h = 96;
  const bars = days.map((x, i) => {
    const gx = 14 + i * 44;
    const hi = Math.max(x.in ? 2 : 0, x.in / max * h), ho = Math.max(x.out ? 2 : 0, x.out / max * h);
    return `<g><title>${esc(dayf.format(x.d))}: masuk ${nf.format(x.in)}, keluar ${nf.format(x.out)}</title>
      <rect class="bar-in" x="${gx}" y="${base - hi}" width="15" height="${hi}" rx="3"/>
      <rect class="bar-out" x="${gx + 17}" y="${base - ho}" width="15" height="${ho}" rx="3"/>
      <text x="${gx + 16}" y="136" text-anchor="middle">${esc(dayf.format(x.d))}</text></g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 322 144" role="img" aria-label="Grafik stok masuk dan keluar 7 hari terakhir">
    <line class="grid" x1="0" x2="322" y1="${base}" y2="${base}"/>
    <line class="grid" x1="0" x2="322" y1="${base - h}" y2="${base - h}" stroke-dasharray="3 4"/>
    <text x="0" y="${base - h - 4}">${nf.format(max)}</text>${bars}</svg>`;
}

function catSummary() {

  const rows = state.cats.map(c => make(c.id, c.name, P.filter(p => p.category_id === c.id)));
  const none = P.filter(p => !p.category_id);
  if (none.length) rows.push(make('__none', 'Tanpa kategori', none));
  return rows;
}

async function compress(file, max = 1000, quality = 0.82) {
  let src, w, h;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); w = src.width; h = src.height; }
  catch {
    const url = URL.createObjectURL(file);
    src = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  const k = Math.min(1, max / Math.max(w, h)), cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cw, ch); x.drawImage(src, 0, 0, cw, ch);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', quality));
  if (!blob) throw new Error('compress');
  return blob;
}

  return path;
}

      <input id="f-newcat" placeholder="Nama kategori baru" maxlength="60" aria-label="Nama kategori baru" style="margin-top:8px" hidden>
      <div class="row2">${isNew ? `<div><label for="f-stock">Stok awal</label><input id="f-stock" inputmode="decimal" value="0"></div>` : ''}
        <div><label for="f-min">Stok minimum</label><input id="f-min" inputmode="decimal" value="${esc(p.min_stock ?? 0)}"></div></div>
      <div class="btns"><button type="button" class="btn" data-act="close">Batal</button><button class="btn primary" id="pfSave">Simpan</button></div>
      ${isNew ? '' : '<div style="margin-top:12px"><button type="button" class="btn danger block" id="pfDel">Hapus barang</button></div>'}
    </form>`);

  const showPrev = () => {
    const src = pending ? objUrl : (!removed && curUrl);
    $('#pf-prev').innerHTML = src ? `<img src="${esc(src)}" alt="Foto barang">` : I.box;
    $('#ph-del-b').hidden = !src;
  };
  const pick = async f => {
    if (!f) return;
    try {
      const b = await compress(f);
      if (objUrl) URL.revokeObjectURL(objUrl);
      pending = b; objUrl = URL.createObjectURL(b); removed = false; showPrev();
    } catch { toast('Foto tidak bisa dibaca. Coba foto lain.', true); }
  };
  showPrev();
  $('#ph-cam-b').onclick = () => $('#ph-cam').click();
  $('#ph-gal-b').onclick = () => $('#ph-gal').click();
  $('#ph-cam').onchange = e => { pick(e.target.files[0]); e.target.value = ''; };
  $('#ph-gal').onchange = e => { pick(e.target.files[0]); e.target.value = ''; };
  $('#ph-del-b').onclick = () => { pending = null; removed = true; showPrev(); };
  $('#f-cat').onchange = () => { const n = $('#f-cat').value === '__new'; $('#f-newcat').hidden = !n; if (n) $('#f-newcat').focus(); };

  const resolveCategory = async () => {
    const sel = $('#f-cat').value;
    if (sel !== '__new') return sel || null;
    const name = $('#f-newcat').value.trim();
    if (!name) return null;
    const ex = state.cats.find(c => c.name.toLowerCase() === name.toLowerCase());
    if (ex) return ex.id;
    const { data, error } = await sb.from('categories').insert({ name }).select().single();
    if (error) throw error;
    return data.id;
  };

  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#pfSave'); btn.disabled = true;
    let photoErr = null, uploaded = null;
    try {
      const row = {
        name: $('#f-name').value.trim(), size: $('#f-size').value.trim() || null, sku: $('#f-sku').value.trim() || null, unit: $('#f-unit').value.trim() || 'pcs',
        category_id: await resolveCategory(), min_stock: Math.max(0, num($('#f-min').value))
      };
      if (isNew) {
        const init = Math.max(0, num($('#f-stock').value));
        const { data, error } = await sb.from('products').insert({ ...row, stock: 0 }).select().single();
        if (error) throw error;
        if (pending) {
          try {
            const path = await uploadPhoto(data.id, pending);
            const u = await sb.from('products').update({ photo_path: path }).eq('id', data.id);
            if (u.error) { removeFile(path); throw u.error; }
          } catch (er) { photoErr = er; }
        }
        if (init > 0) {
          const r = await sb.rpc('record_movement', { p_product: data.id, p_type: 'in', p_qty: init, p_note: 'Stok awal' });
          if (r.error) throw r.error;
        }
      } else {
        let newPath;
        if (pending) { try { uploaded = await uploadPhoto(p.id, pending); newPath = uploaded; } catch (er) { photoErr = er; } }
        else if (removed) newPath = null;
        const upd = { ...row, updated_at: new Date().toISOString() };
        if (newPath !== undefined) upd.photo_path = newPath;
        const { error } = await sb.from('products').update(upd).eq('id', p.id);
        if (error) { removeFile(uploaded); throw error; }
        if (newPath !== undefined && p.photo_path) removeFile(p.photo_path);
      }
      closeSheet();
      toast(photoErr ? 'Barang tersimpan, tetapi foto gagal diunggah: ' + photoErr.message : 'Barang disimpan', !!photoErr);
      await loadAll();
    } catch (err) {
      toast(err.code === '23505' ? (/categor/i.test(err.message) ? 'Nama kategori sudah ada.' : 'Kode / SKU sudah dipakai barang lain.') : err.message, true);
      btn.disabled = false;
    }
  };

  const del = $('#pfDel');
  if (del) del.onclick = async () => {
    if (!del.dataset.sure) { del.dataset.sure = '1'; del.textContent = 'Ketuk lagi untuk menghapus beserta riwayatnya'; setTimeout(() => { if (del.isConnected) { delete del.dataset.sure; del.textContent = 'Hapus barang'; } }, 4000); return; }
    del.disabled = true;
    const { error } = await sb.from('products').delete().eq('id', p.id);
    if (error) { toast(error.message, true); del.disabled = false; return; }
    removeFile(p.photo_path);
    closeSheet(); toast('Barang dihapus'); await loadAll();
  };
}

/* ---------- ekspor Excel ---------- */
function loadScript(src) {
  return new Promise((res, rej) => {
    if (window.ExcelJS) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => rej(new Error('Gagal memuat pustaka Excel. Periksa koneksi internet.'));
    document.head.appendChild(s);
  });
}
async function fetchAllMoves() {
  const out = [];
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('stock_movements').select('*').order('created_at', { ascending: false }).range(from, from + 999);
    if (error) throw error;
    out.push(...data);
    if (data.length < 1000) break;
  }
  return out;
}
async function thumbData(url, size = 120) {
  const r = await fetch(url); if (!r.ok) throw new Error('foto');
  const bmp = await createImageBitmap(await r.blob());
  const k = Math.min(1, size / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * k)), h = Math.max(1, Math.round(bmp.height * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h);
  return { b64: c.toDataURL('image/jpeg', 0.8).split(',')[1], w, h };
}
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function exportExcel(withPhotos, progress) {
  progress('Menyiapkan Excel…');
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
  progress('Mengambil seluruh riwayat…');
  const moves = await fetchAllMoves();
  const byId = Object.fromEntries(state.products.map(p => [p.id, p]));

  const wb = new ExcelJS.Workbook(); wb.creator = 'StokKu'; wb.created = new Date();
  const thin = { style: 'thin', color: { argb: 'FFD6DFDB' } }, border = { top: thin, left: thin, bottom: thin, right: thin };
  const zebra = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF4F8F6' } };
  const fills = {
    Habis: [{ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFADAD7' } }, 'FFB3261E'],
    Menipis: [{ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFBE9C8' } }, 'FF8A5000'],
    Aman: [{ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFDFF1E5' } }, 'FF1F7A45']
  };
  const intFmt = v => Number.isInteger(v) ? '#,##0' : '#,##0.00';

  const frame = (ws, title, cols) => {
    const n = cols.length;
    ws.mergeCells(1, 1, 1, n);
    const t = ws.getCell(1, 1); t.value = title; t.font = { size: 16, bold: true, color: { argb: 'FF0A6A57' } };
    t.alignment = { vertical: 'middle' }; ws.getRow(1).height = 28;
    ws.mergeCells(2, 1, 2, n);
    const s = ws.getCell(2, 1); s.value = `Diekspor ${longf.format(new Date())} · ${state.user.email}`; s.font = { size: 10, color: { argb: 'FF5B6B64' } };
    const hr = ws.getRow(4); hr.height = 26;
    cols.forEach((c, i) => {
      const cell = hr.getCell(i + 1); cell.value = c.l;
      cell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
      cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF0A6A57' } };
      cell.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true };
      cell.border = border;
      ws.getColumn(i + 1).width = c.w;
    });
    ws.views = [{ state: 'frozen', ySplit: 4 }];
    ws.autoFilter = { from: { row: 4, column: 1 }, to: { row: 4, column: n } };
  };
  const styleRow = (row, cols, i, tall) => {
    if (tall) row.height = tall;
    row.eachCell({ includeEmpty: true }, (c, ci) => {
      const col = cols[ci - 1]; if (!col) return;
      c.border = border;
      c.alignment = { vertical: 'middle', horizontal: col.h, wrapText: !!col.wrap };
      if (i % 2 === 0) c.fill = zebra;
    });
  };

  /* Sheet 1: Barang */
  const ws = wb.addWorksheet('Barang');
  const cols = [
    { k: 'no', l: 'No', w: 6, h: 'center' },
    ...(withPhotos ? [{ k: 'foto', l: 'Foto', w: 13, h: 'center' }] : []),
    { k: 'sku', l: 'Kode / SKU', w: 16, h: 'left' },
    { k: 'name', l: 'Nama Barang', w: 34, h: 'left', wrap: true },
    { k: 'size', l: 'Ukuran', w: 18, h: 'left', wrap: true },
    { k: 'cat', l: 'Kategori', w: 20, h: 'left' },
    { k: 'unit', l: 'Satuan', w: 10, h: 'center' },
    { k: 'stock', l: 'Stok', w: 10, h: 'right' },
    { k: 'min', l: 'Stok Minimum', w: 14, h: 'right' },
    { k: 'st', l: 'Status', w: 12, h: 'center' }
  ];
  frame(ws, 'Daftar Stok Barang', cols);
  const list = [...state.products].sort((a, b) => {
    const ca = a.category_id ? catOf(a) : '￿', cb = b.category_id ? catOf(b) : '￿';
    return ca.localeCompare(cb, 'id') || a.name.localeCompare(b.name, 'id');
  });
  const jobs = [];
  list.forEach((p, idx) => {
    const st = STAT_LABEL[status(p)];
    const vals = { no: idx + 1, foto: '', sku: p.sku || '', name: p.name, size: p.size || '', cat: catOf(p), unit: p.unit, stock: Number(p.stock), min: Number(p.min_stock), st };
    const row = ws.addRow(cols.map(c => vals[c.k]));
    styleRow(row, cols, idx + 1, withPhotos ? 46 : 20);
    const si = cols.findIndex(c => c.k === 'stock') + 1, mi = cols.findIndex(c => c.k === 'min') + 1, ti = cols.findIndex(c => c.k === 'st') + 1;
    row.getCell(si).numFmt = intFmt(vals.stock); row.getCell(si).font = { bold: true };
    row.getCell(mi).numFmt = intFmt(vals.min);
    const [fill, color] = fills[st];
    row.getCell(ti).fill = fill; row.getCell(ti).font = { bold: true, color: { argb: color } };
    if (withPhotos && p.photo_path && state.photos[p.photo_path]) jobs.push({ rowNo: row.number, url: state.photos[p.photo_path] });
  });
  for (let k = 0; k < jobs.length; k += 6) {
    progress(`Menyiapkan foto ${Math.min(k + 6, jobs.length)} dari ${jobs.length}…`);
    await Promise.all(jobs.slice(k, k + 6).map(async j => {
      try {
        const t = await thumbData(j.url), f = 40 / Math.max(t.w, t.h);
        const id = wb.addImage({ base64: t.b64, extension: 'jpeg' });
        ws.addImage(id, { tl: { col: 1.15, row: j.rowNo - 1 + 0.1 }, ext: { width: Math.round(t.w * f), height: Math.round(t.h * f) } });
      } catch { /* lewati foto yang gagal diambil */ }
    }));
  }

  /* Sheet 2: Riwayat */
  progress('Menyusun riwayat…');
  const wm = wb.addWorksheet('Riwayat');
  const mcols = [
    { l: 'Tanggal', w: 18, h: 'center' }, { l: 'Barang', w: 34, h: 'left', wrap: true }, { l: 'Ukuran', w: 18, h: 'left', wrap: true }, { l: 'Kategori', w: 20, h: 'left' },
    { l: 'Jenis', w: 11, h: 'center' }, { l: 'Jumlah', w: 11, h: 'right' }, { l: 'Satuan', w: 10, h: 'center' },
    { l: 'Stok Setelah', w: 14, h: 'right' }, { l: 'Catatan', w: 38, h: 'left', wrap: true }
  ];
  frame(wm, 'Riwayat Stok Masuk dan Keluar', mcols);
  const tcolor = { in: ['Masuk', 'FF1F7A45'], out: ['Keluar', 'FF8A5000'], adjust: ['Koreksi', 'FF5B6B64'] };
  moves.forEach((m, idx) => {
    const p = byId[m.product_id] || {}, d = new Date(m.created_at);
    const [label, color] = tcolor[m.type];
    const q = Number(m.qty), signed = m.type === 'in' ? q : m.type === 'out' ? -q : q;
    const row = wm.addRow([new Date(d.getTime() - d.getTimezoneOffset() * 60000), p.name || '', p.size || '', p.category_id ? catOf(p) : 'Tanpa kategori', label, signed, p.unit || '', Number(m.stock_after), m.note || '']);
    styleRow(row, mcols, idx + 1, 0);
    row.getCell(1).numFmt = 'dd/mm/yyyy hh:mm';
    const intOk = Number.isInteger(q);
    row.getCell(6).numFmt = m.type === 'adjust' ? intFmt(q) : (intOk ? '+#,##0;-#,##0' : '+#,##0.00;-#,##0.00');
    row.getCell(8).numFmt = intFmt(Number(m.stock_after));
    row.getCell(5).font = { bold: true, color: { argb: color } };
    row.getCell(6).font = { bold: true, color: { argb: color } };
  });

  /* Sheet 3: Per Kategori */
  const wc = wb.addWorksheet('Per Kategori');
  const ccols = [{ l: 'Kategori', w: 30, h: 'left' }, { l: 'Jumlah Jenis Barang', w: 20, h: 'right' }, { l: 'Menipis', w: 12, h: 'right' }, { l: 'Habis', w: 12, h: 'right' }];
  frame(wc, 'Ringkasan per Kategori', ccols);
  const sum = catSummary();
  sum.forEach((r, idx) => {
    const row = wc.addRow([r.name, r.n, r.low, r.out]);
    styleRow(row, ccols, idx + 1, 0);
  });
  const tot = wc.addRow(['Total', sum.reduce((a, r) => a + r.n, 0), sum.reduce((a, r) => a + r.low, 0), sum.reduce((a, r) => a + r.out, 0)]);
  tot.eachCell(c => { c.font = { bold: true }; c.border = { ...border, top: { style: 'medium', color: { argb: 'FF0A6A57' } } }; c.alignment = { horizontal: c.col === 1 ? 'left' : 'right' }; });

  progress('Membuat file…');
  const buf = await wb.xlsx.writeBuffer();
  downloadBlob(`StokKu-${new Date().toISOString().slice(0, 10)}.xlsx`, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

const notifOn = () => { try { return localStorage.getItem('stokku_notif') === '1' && 'Notification' in window && Notification.permission === 'granted'; } catch { return false; } };
function sysNotify(title, body) {

}
function updateBell() {
  const b = $('#bellBadge'), bell = $('#bellBtn'); if (!b || !bell) return;

        <button type="button" data-t="in">Masuk</button><button type="button" data-t="out">Keluar</button><button type="button" data-t="adjust">Koreksi</button></div>
      <label for="m-qty" id="m-qty-l">Jumlah</label><input id="m-qty" inputmode="decimal" required placeholder="0">
      <label for="m-note">Catatan (opsional)</label><input id="m-note" maxlength="160" placeholder="Contoh: pembelian dari supplier">
      <div class="preview" id="m-prev"></div>
      <div class="btns"><button type="button" class="btn" data-act="close">Batal</button><button class="btn primary" id="mSave">Simpan</button></div>
    </form>`);
  const calc = () => {
    const q = num($('#m-qty').value), cur = Number(p.stock);
    const next = t === 'in' ? cur + q : t === 'out' ? cur - q : q;
    const bad = t === 'out' && q > cur;
    const prev = $('#m-prev');
    prev.className = 'preview' + (bad ? ' bad' : '');
    prev.textContent = bad ? `Stok tidak cukup. Tersisa ${nf.format(cur)} ${p.unit}.` : `Stok setelah disimpan: ${nf.format(next)} ${p.unit}`;
    $('#mSave').disabled = bad;
  };
  const sync = () => {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.t === t)));
    $('#m-qty-l').textContent = t === 'adjust' ? 'Stok sebenarnya (hasil hitung)' : 'Jumlah';
    calc();
  };
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { t = b.dataset.t; sync(); });
  $('#m-qty').oninput = calc; sync();
  $('#m-qty').focus();
  $('#mf').onsubmit = async e => {
    e.preventDefault();
    const btn = $('#mSave'); btn.disabled = true;
    const qty = num($('#m-qty').value);
    if (t !== 'adjust' && qty <= 0) { toast('Jumlah harus lebih dari 0.', true); btn.disabled = false; return; }
    const { error } = await sb.rpc('record_movement', { p_product: p.id, p_type: t, p_qty: qty, p_note: $('#m-note').value });
    if (error) { toast(error.message, true); btn.disabled = false; return; }
    closeSheet(); toast('Stok diperbarui'); await loadAll();
    const np = state.products.find(x => x.id === p.id);
    if (np && t !== 'in' && status(np) !== 'ok') limitSheet(np);
  };
}

/* ---------- event ---------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderView(); scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, find = () => state.products.find(p => p.id === el.dataset.id);
  if (act === 'close') return closeSheet();
  if (act === 'refresh') return loadAll();
  if (act === 'new-product') return productSheet(null);
  if (act === 'edit') { const p = find(); if (p) productSheet(p); return; }
  if (act === 'photo') { const p = find(); if (p && state.photos[p.photo_path]) photoSheet(p); return; }
  if (act === 'move') { const p = find(); if (p) moveSheet(p, el.dataset.t); return; }
  if (act === 'stat') { state.stat = el.dataset.v; return renderView(); }
  if (act === 'cat') { state.cat = el.dataset.v; return renderView(); }
  if (act === 'cats') return catSheet();
  if (act === 'mtype') { state.mtype = el.dataset.v; return renderView(); }
  if (act === 'alerts') return alertSheet();
  if (act === 'go-low') { closeSheet(); state.tab = 'items'; state.stat = 'alert'; state.cat = ''; state.q = ''; renderView(); scrollTo(0, 0); return; }
  if (act === 'notif') {
    try {
      if (!('Notification' in window)) throw new Error('unsupported');
      if (notifOn()) { localStorage.setItem('stokku_notif', '0'); toast('Notifikasi perangkat dimatikan'); }
      else {
        const r = await Notification.requestPermission();
        if (r === 'granted') { localStorage.setItem('stokku_notif', '1'); toast('Notifikasi perangkat diaktifkan'); }
        else toast('Izin notifikasi ditolak. Ubah di pengaturan browser.', true);
      }
    } catch { toast('Perangkat ini tidak mendukung notifikasi dari halaman web.', true); }
    return renderView();
  }
  if (act === 'go-cat') { state.tab = 'items'; state.cat = el.dataset.id; state.stat = 'all'; state.q = ''; renderView(); scrollTo(0, 0); return; }
  if (act === 'go-history') { state.tab = 'history'; return renderView(); }
  if (act === 'export') return exportSheet();
  if (act === 'cat-del') {
    if (!el.dataset.sure) {
      el.dataset.sure = '1'; el.textContent = 'Yakin?'; el.classList.add('danger');
      setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.textContent = 'Hapus'; el.classList.remove('danger'); } }, 3500);
      return;
    }
    const { error } = await sb.from('categories').delete().eq('id', el.dataset.id);
    if (error) { toast(error.message, true); return; }
    toast('Kategori dihapus. Barangnya menjadi tanpa kategori.'); await loadAll(); catDraw && catDraw();
    return;
  }
  if (act === 'logout') { await sb.auth.signOut(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { state.q = e.target.value; renderView(); } });

/* ---------- mulai ---------- */
(async function init() {
  if (!ready) return setupView();
  sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { state.user = null; state.products = []; state.cats = []; state.moves = []; state.photos = {}; state.alerted = false; state.tab = 'home'; closeSheet(); authView(); } });
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session.user); else authView();
})();
})();
</script>
